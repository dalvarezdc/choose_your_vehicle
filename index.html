<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compare UAE 4x4s — price, power, torque, real-world km/L, dune and maintenance scores." />
    <script>
      // Set the theme before first paint to avoid a dark/light flash.
      try {
        var t = localStorage.getItem('cyv-theme')
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <title>Choose Your Vehicle · UAE 4x4 comparison</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
